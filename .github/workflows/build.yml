name: Build and Release APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/RandomGospel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RandomGospel-apk
          path: artifacts/RandomGospel.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Random Gospel v${{ github.run_number }}
          body: "Automated build from commit ${{ github.sha }}."
          files: artifacts/RandomGospel.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
